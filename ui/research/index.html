<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BS-Bench Research Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./research.css">
  <script type="module" src="./research.js"></script>
</head>
<body>
  <main class="research-shell">
    <header class="research-toolbar">
      <div class="research-brand">
        <button class="research-home-btn" id="research-home-btn" type="button">BS-Bench Research Dashboard</button>
      </div>

      <div class="research-scope-tabs" role="tablist" aria-label="Experiment scope">
        <button class="research-scope-tab is-active" data-scope="all" type="button">all</button>
        <button class="research-scope-tab" data-scope="0" type="button">exp0</button>
        <button class="research-scope-tab" data-scope="1" type="button">exp1</button>
        <button class="research-scope-tab" data-scope="2" type="button">exp2</button>
        <button class="research-scope-tab" data-scope="3" type="button">exp3</button>
      </div>
    </header>

    <section class="research-stage">
      <div class="research-stage-top">
        <div class="research-view-tabs" role="tablist" aria-label="Research views">
          <button class="research-view-tab is-active" data-panel="overview" type="button">overview</button>
          <button class="research-view-tab" data-panel="charts" type="button">charts</button>
          <button class="research-view-tab" data-panel="cast" type="button">players</button>
        </div>
        <div class="research-status" id="research-status">Loading cohort…</div>
      </div>

      <div class="research-chart-tabs" id="research-chart-tabs" hidden>
        <button class="research-chart-tab is-active" data-chart-view="ranking" type="button">win rates</button>
        <button class="research-chart-tab" data-chart-view="lie-win" type="button">lie vs seat win</button>
        <button class="research-chart-tab" data-chart-view="paranoia-win" type="button">challenge vs seat win</button>
      </div>

      <div class="research-empty" id="research-empty" hidden></div>

      <div class="research-panels">
        <section class="research-panel is-active" data-panel-content="overview">
          <div class="research-overview-grid">
            <article class="research-card research-card--summary">
              <div class="research-summary-head">
                <div class="research-top-model" id="research-top-model"></div>
                <div class="research-summary-copy">
                  <h2 id="scope-title">All Experiments</h2>
                  <p class="research-summary-line" id="scope-summary"></p>
                  <p class="research-summary-detail" id="scope-detail"></p>
                  <div class="research-top-model-copy research-top-model-copy--inline" id="research-top-model-copy"></div>
                </div>
              </div>

              <div class="research-metric-row">
                <article class="research-metric-card">
                  <div class="research-metric-label">models</div>
                  <div class="research-metric-value" id="model-count">0</div>
                </article>
                <article class="research-metric-card">
                  <div class="research-metric-label">included games</div>
                  <div class="research-metric-value" id="included-games">0</div>
                </article>
                <article class="research-metric-card">
                  <div class="research-metric-label">top win share</div>
                  <div class="research-metric-value" id="top-win-share">0.0%</div>
                </article>
                <article class="research-metric-card">
                  <div class="research-metric-label">top seat win</div>
                  <div class="research-metric-value" id="top-win-rate">0.0%</div>
                </article>
              </div>

            </article>

            <article class="research-card research-card--overview-spotlight">
              <div class="research-panel-head">
                <div>
                  <h3 id="overview-chart-title">Win Share Snapshot</h3>
                </div>
              </div>
              <div class="research-overview-spotlight" id="overview-chart-canvas"></div>
            </article>
          </div>
        </section>

        <section class="research-panel" data-panel-content="charts" hidden>
          <article class="research-card research-card--chart">
            <div class="research-panel-head research-panel-head--chart">
              <div>
                <h3 id="chart-title">Who clears out most often?</h3>
                <p class="research-chart-copy" id="chart-copy">Aggregate view across the 600-game paper cohort.</p>
              </div>
              <div class="research-chart-legend" id="chart-legend"></div>
            </div>
            <div class="research-chart-canvas" id="chart-canvas"></div>
            <div class="research-chart-inspector" id="chart-inspector">Hover a point to inspect the model-condition row.</div>
          </article>
        </section>

        <section class="research-panel" data-panel-content="cast" hidden>
          <article class="research-card research-card--cast">
            <button class="research-player-nav research-player-nav--prev" id="research-player-prev" type="button" aria-label="Previous player">‹</button>
            <div class="research-player-stage" id="research-player-stage"></div>
            <button class="research-player-nav research-player-nav--next" id="research-player-next" type="button" aria-label="Next player">›</button>
          </article>
        </section>
      </div>
    </section>

    <footer class="research-footer">
      <div class="research-footer-links" aria-label="Project links">
        <a class="research-footer-icon" href="https://github.com/thomasjvu/llm-bs-arena" target="_blank" rel="noreferrer" aria-label="GitHub">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .297C5.373.297 0 5.67 0 12.297c0 5.303 3.438 9.8 8.205 11.387c.6.111.82-.261.82-.579c0-.285-.01-1.04-.016-2.04c-3.338.725-4.042-1.61-4.042-1.61c-.546-1.387-1.333-1.757-1.333-1.757c-1.089-.745.083-.729.083-.729c1.205.085 1.839 1.237 1.839 1.237c1.07 1.834 2.807 1.304 3.492.997c.108-.775.418-1.304.762-1.604c-2.665-.303-5.467-1.333-5.467-5.931c0-1.31.468-2.381 1.236-3.221c-.124-.303-.536-1.524.117-3.176c0 0 1.008-.322 3.301 1.23A11.5 11.5 0 0 1 12 6.118a11.5 11.5 0 0 1 3.006.404c2.291-1.552 3.297-1.23 3.297-1.23c.655 1.652.243 2.873.12 3.176c.77.84 1.235 1.911 1.235 3.221c0 4.609-2.807 5.625-5.48 5.921c.43.371.814 1.103.814 2.222c0 1.606-.014 2.902-.014 3.297c0 .321.216.694.825.576C20.565 22.092 24 17.597 24 12.297C24 5.67 18.627.297 12 .297" fill="currentColor"/>
          </svg>
        </a>
        <a class="research-footer-icon" href="https://arxiv.org/search/?query=BS-Bench%3A+Measuring+LLM+Deception%2C+Lie+Detection%2C+and+Instruction+Compliance&searchtype=all&source=header" target="_blank" rel="noreferrer" aria-label="arXiv">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.8423 0a1.0037 1.0037 0 0 0-.922.6078c-.1536.3687-.0438.6275.2938 1.1113l6.9185 8.3597-1.0223 1.1058a1.0393 1.0393 0 0 0 .003 1.4229l1.2292 1.3135-5.4391 6.4444c-.2803.299-.4538.823-.2971 1.1986a1.0253 1.0253 0 0 0 .9585.635.9133.9133 0 0 0 .6891-.3405l5.783-6.126 7.4902 8.0051a.8527.8527 0 0 0 .6835.2597.9575.9575 0 0 0 .8777-.6138c.1577-.377-.017-.7502-.306-1.1407l-7.0518-8.3418 1.0632-1.13a.9626.9626 0 0 0 .0089-1.3165L4.6336.4639s-.3733-.4535-.768-.463zm0 .272h.0166c.2179.0052.4874.2715.5644.3639l.005.006.0052.0055 10.169 10.9905a.6915.6915 0 0 1-.0072.945l-1.0666 1.133-1.4982-1.7724-8.5994-10.39c-.3286-.472-.352-.6183-.2592-.841a.7307.7307 0 0 1 .6704-.4401Zm14.341 1.5701a.877.877 0 0 0-.6554.2418l-5.6962 6.1584 1.6944 1.8319 5.3089-6.5138c.3251-.4335.479-.6603.3247-1.0292a1.1205 1.1205 0 0 0-.9763-.689zm-7.6557 12.2823 1.3186 1.4135-5.7864 6.1295a.6494.6494 0 0 1-.4959.26.7516.7516 0 0 1-.706-.4669c-.1119-.2682.0359-.6864.2442-.9083l.0051-.0055.0047-.0055z" fill="currentColor"/>
          </svg>
        </a>
      </div>
      <div class="research-footer-line">
        <span>COPYRIGHT 2026 <a href="https://llmletsplay.com" target="_blank" rel="noreferrer">LLM LETS PLAY</a>.</span>
        <span>DEVELOPED BY <a href="https://ultima.gg" target="_blank" rel="noreferrer">ULTIMA.GG</a></span>
      </div>
    </footer>
  </main>
</body>
</html>
